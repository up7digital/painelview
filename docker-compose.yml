services:
  app:
    container_name: WebView
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    command: >
      sh -c "
        /env/bin/python manage.py migrate &&
        /env/bin/python manage.py runserver 0.0.0.0:8080
      "
    environment:
      - DEBUG=1
