services:
  app:
    container_name: WebView
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@email.com
      DJANGO_SUPERUSER_PASSWORD: PainelView
    volumes:
      - .:/app
      - static_volume:/app/static

volumes:
  static_volume:
