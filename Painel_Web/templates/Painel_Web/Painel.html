{% load static %}

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">


    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% url 'personalizacao_css' %}">
    <link rel="stylesheet" href="{% static 'Painel_Web/css/style_modelo_painel.css' %}">
    <link rel="stylesheet" href="{% static 'Painel_Web/css/style_painel.css' %}?v=1.2.1">

    <title>Painel de Senhas</title>
</head>

<body>

    <div id="area-exibicao_senhas">
        {% include "Painel_Web/partials/template_padrao.html" %}
    </div>

    <div id="area-tela_descanso">
        {% include "Painel_Web/partials/tela_descanso.html" %}
    </div>


</body>

<script>window.PAINEL_ID = {{ painel.id }}</script>
{{ vocalizacao_config|json_script:"vocalizacao-config" }}
<script>
    window.VOCALIZACAO_CONFIG = JSON.parse(
        document.getElementById("vocalizacao-config").textContent
    );
</script>
<script
    src="https://unpkg.com/talkify-tts@4.0.0/dist/talkify.min.js"
    onerror="console.error('🔇 Falha ao carregar a biblioteca Talkify.')"
></script>
<script src="{% static 'js/vocalizacao.js' %}?v=1.2.1"></script>
<script src="{% static 'js/script.js' %}?v=1.3.3"></script>
<script>
    window.TEMPO_IMAGEM = {{ config.tempo_exibicao_imagem|default:5 }} * 1000;
    window.TEMPO_TELA_DESCANSO = {{ config.tempo_popup|default:10 }} * 1000;
    window.INTERVALO_ATUALIZACAO_MIDIAS = 10000;
    window.URL_MIDIAS_PAINEL = "/painel-midias/";
</script>
<script src="{% static 'js/mecanismos_interacao.js' %}?v=2.0.0"></script>

</html>
