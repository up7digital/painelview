{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="{% static 'Painel_Web/css/style_painel_home.css' %}">

    <title>Painel Home</title>
</head>
<body>
    <main id="main-painel_home">
        <h2 class="title">
            <img src={% static 'Painel_Web/img/cone_confete.png' %} style="height: 50px">
            Painel View - SGA
            <img src={% static 'Painel_Web/img/cone_confete.png' %} style="height: 50px; transform: scaleX(-1);">
        </h2>
        
        <form id="form_home" method="get" action="{% url 'exibir_painel' %}">
            <select id="select_setor" name="setor" required>
                <option value="">-- Escolher um setor --</option>
                {% for setor in setores %}
                <option value="{{ setor.id }}">{{ setor.nome_setor }}</option>
                {% endfor %}
            </select>

            <select id="select_painel" name="painel" required disabled>
                <option value="">-- Escolher um painel --</option>
            </select>

            <hr>

            <button type="submit" id="btn-acessar_painel">Acessar</button>
        </form>
        <span id="span-versao">Versão 2.0.0 - Atualização de Carnaval</span>
    </main>
</body>

<!--Área de Scripts-->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="{% static 'js/mecanismos_home.js' %}"></script>

<script>


</script>

</html>
