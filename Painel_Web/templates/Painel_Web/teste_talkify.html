<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Artyom.js - Text to Speech</title>

    <!-- Artyom.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/artyom.js@1.0.6/build/artyom.window.min.js"></script>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            margin-top: 12px;
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #0066ff;
            color: #fff;
        }

        button:hover {
            background-color: #0052cc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Teste de Leitura com Artyom.js</h2>

    <form id="ttsForm">
        <textarea id="texto" placeholder="Digite o texto que será verbalizado..."></textarea>
        <button type="submit">Ouvir texto</button>
    </form>
</div>

<script>
    // Inicializa o Artyom
    const artyom = new Artyom();

    artyom.initialize({
        lang: "pt-BR",
        continuous: false,
        debug: false,
        listen: false
    });

    document.getElementById("ttsForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const texto = document.getElementById("texto").value.trim();

        if (!texto) {
            alert("Digite algum texto para ser lido.");
            return;
        }

        // Cancela qualquer fala em andamento
        artyom.fatality();

        // Fala o texto
        artyom.say(texto, {
            speed: 1,
            pitch: 1,
            volume: 1
        });
    });
</script>

</body>
</html>
